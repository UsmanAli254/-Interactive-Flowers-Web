
<!DOCTYPE html>
<html lang='en'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Flowers for You</title>
<style>
:root {
  --bg: #06000a;
  --glow-red: #6b0000;
  --petal-base: #8b0000;
  --petal-mid: #c0392b;
  --petal-tip: #ff8a80;
  --leaf: #00695c;
  --leaf-light: #26a69a;
  --stem: #1b5e20;
  --grass: #2e7d32;
  --pill-bg: rgba(80,0,20,0.75);
  --pill-border: rgba(255,100,100,0.35);
  --pill-text: #ffb3b3;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{position:relative;display:flex;align-items:flex-end;justify-content:center}

/* Radial glow at bottom */
body::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 50% at 50% 100%, rgba(120,0,0,0.55) 0%, rgba(60,0,0,0.2) 40%, transparent 70%);
  pointer-events:none;z-index:0;
}
/* Grain overlay */
body::after{
  content:'';position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  opacity:0.18;pointer-events:none;z-index:1;
}

#scene{position:relative;width:100vw;height:100vh;z-index:2}
#garden-svg{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:700px;max-width:100vw;height:90vh}

/* Stem sway */
.flower-group{transform-origin:bottom center;animation:sway1 4s ease-in-out infinite}
.flower-group:nth-child(2){animation:sway2 5s ease-in-out infinite;animation-delay:-1.5s}
.flower-group:nth-child(3){animation:sway3 3.8s ease-in-out infinite;animation-delay:-0.8s}
.flower-group:nth-child(4){animation:sway1 4.5s ease-in-out infinite;animation-delay:-2s}
.flower-group:nth-child(5){animation:sway2 5.2s ease-in-out infinite;animation-delay:-3s}

@keyframes sway1{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes sway2{0%,100%{transform:rotate(1.5deg)}50%{transform:rotate(-2.5deg)}}
@keyframes sway3{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(3deg)}}

/* Petal bloom */
.petal{transform-origin:50% 100%;animation:bloom 1.2s cubic-bezier(0.34,1.56,0.64,1) forwards;opacity:0}
@keyframes bloom{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}
.petal:nth-child(1){animation-delay:0.1s}
.petal:nth-child(2){animation-delay:0.2s}
.petal:nth-child(3){animation-delay:0.3s}
.petal:nth-child(4){animation-delay:0.4s}
.petal:nth-child(5){animation-delay:0.5s}
.petal:nth-child(6){animation-delay:0.6s}
.petal:nth-child(7){animation-delay:0.7s}

/* Petal shimmer */
.petal{animation:bloom 1.2s cubic-bezier(0.34,1.56,0.64,1) forwards, shimmer 3s ease-in-out infinite}
@keyframes shimmer{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}

/* Flower glow */
.flower-head{filter:drop-shadow(0 0 8px rgba(200,50,50,0.6)) drop-shadow(0 0 20px rgba(180,0,0,0.3))}
.flower-group:hover .flower-head{filter:drop-shadow(0 0 16px rgba(255,100,80,0.9)) drop-shadow(0 0 35px rgba(220,50,0,0.5));cursor:pointer}
.flower-group:hover .petal{filter:brightness(1.3)}

/* Fireflies */
.firefly{position:absolute;width:4px;height:4px;border-radius:50%;background:#fffde7;box-shadow:0 0 6px 2px rgba(255,255,180,0.8);animation:fly linear infinite;pointer-events:none}
@keyframes fly{0%{transform:translate(0,0);opacity:0}10%{opacity:1}90%{opacity:0.8}100%{transform:translate(var(--dx),var(--dy));opacity:0}}

/* Falling petals */
.fall-petal{position:absolute;top:-30px;pointer-events:none;animation:fall linear infinite;opacity:0.7}
@keyframes fall{0%{transform:translateY(0) rotate(0deg) translateX(0);opacity:0.8}100%{transform:translateY(110vh) rotate(720deg) translateX(var(--drift));opacity:0}}

/* Ripple */
.ripple{position:absolute;border-radius:50%;border:2px solid rgba(255,150,150,0.6);animation:ripple-out 0.8s ease-out forwards;pointer-events:none;transform:translate(-50%,-50%)}
@keyframes ripple-out{0%{width:0;height:0;opacity:1}100%{width:120px;height:120px;opacity:0}}

/* Burst petal */
.burst-petal{position:absolute;pointer-events:none;animation:burst-fly 1s ease-out forwards}
@keyframes burst-fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--bx),var(--by)) scale(0.3);opacity:0}}

/* Pills */
.pill{position:absolute;background:var(--pill-bg);border:1px solid var(--pill-border);border-radius:999px;padding:10px 20px;color:var(--pill-text);font-family:'Georgia',serif;font-size:13px;letter-spacing:0.5px;backdrop-filter:blur(8px);white-space:nowrap;animation:float-pill 3s ease-in-out infinite;z-index:10;pointer-events:none;box-shadow:0 0 15px rgba(180,0,0,0.2)}
.pill:nth-child(1){top:18%;left:4%;animation-delay:0s}
.pill:nth-child(2){top:22%;right:4%;animation-delay:0.8s}
.pill:nth-child(3){top:58%;left:3%;animation-delay:1.6s}
.pill:nth-child(4){top:62%;right:3%;animation-delay:2.4s}
@keyframes float-pill{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
</style>

          <path class="petal" d="M0,0 Q-14,-28 -6,-54 Q0,-66 6,-54 Q14,-28 0,0" fill="url(#pg2)" opacity="0.92" transform="rotate(-20)"/>
          <path class="petal" d="M0,0 Q-14,-28 -6,-54 Q0,-66 6,-54 Q14,-28 0,0" fill="url(#pg1)" opacity="0.9" transform="rotate(32)"/>
          <path class="petal" d="M0,0 Q-14,-28 -6,-54 Q0,-66 6,-54 Q14,-28 0,0" fill="url(#pg3)" opacity="0.92" transform="rotate(84)"/>
          <path class="petal" d="M0,0 Q-14,-28 -6,-54 Q0,-66 6,-54 Q14,-28 0,0" fill="url(#pg2)" opacity="0.9" transform="rotate(136)"/>
          <path class="petal" d="M0,0 Q-14,-28 -6,-54 Q0,-66 6,-54 Q14,-28 0,0" fill="url(#pg1)" opacity="0.92" transform="rotate(188)"/>
          <path class="petal" d="M0,0 Q-14,-28 -6,-54 Q0,-66 6,-54 Q14,-28 0,0" fill="url(#pg3)" opacity="0.9" transform="rotate(240)"/>
          <path class="petal" d="M0,0 Q-14,-28 -6,-54 Q0,-66 6,-54 Q14,-28 0,0" fill="url(#pg2)" opacity="0.92" transform="rotate(292)"/>
        </g>
        <circle r="8" fill="#1a0000"/>
        <circle cx="-3" cy="-3" r="1.8" fill="url(#stameng)"/>
        <circle cx="3" cy="-3" r="2" fill="#ffd54f"/>
        <circle cx="0" cy="3" r="1.8" fill="url(#stameng)"/>
        <circle cx="-3" cy="2" r="1.5" fill="#ffcc02"/>
        <circle cx="3" cy="2" r="1.8" fill="url(#stameng)"/>
      </g>
    </g>

  </svg><!-- end garden-svg -->
</div><!-- end scene -->
<script>
// ── Fireflies ──────────────────────────────────────────────
const scene = document.getElementById('scene');
for(let i=0;i<22;i++){
  const ff = document.createElement('div');
  ff.className = 'firefly';
  const x = Math.random()*100, y = Math.random()*85;
  const dx = (Math.random()-0.5)*300, dy = (Math.random()-0.5)*200;
  const dur = 4+Math.random()*8, delay = Math.random()*8;
  ff.style.cssText = `left:${x}%;top:${y}%;--dx:${dx}px;--dy:${dy}px;animation-duration:${dur}s;animation-delay:-${delay}s;width:${2+Math.random()*3}px;height:${2+Math.random()*3}px;opacity:${0.4+Math.random()*0.6}`;
  scene.appendChild(ff);
}

// ── Falling petals ─────────────────────────────────────────
const petalPaths = [
  'M0,0 Q-8,-15 -3,-28 Q0,-34 3,-28 Q8,-15 0,0',
  'M0,0 Q-10,-12 -4,-24 Q0,-30 4,-24 Q10,-12 0,0',
  'M0,0 Q-7,-18 -2,-32 Q0,-38 2,-32 Q7,-18 0,0'
];
for(let i=0;i<12;i++){
  const fp = document.createElementNS('http://www.w3.org/2000/svg','svg');
  fp.setAttribute('width','20');fp.setAttribute('height','40');
  fp.setAttribute('viewBox','-15 -40 30 45');
  fp.style.position='absolute';
  const path = document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d', petalPaths[i%3]);
  const colors=['#c0392b','#e74c3c','#ff6b6b','#ff8a80','#b71c1c'];
  path.setAttribute('fill', colors[i%colors.length]);
  path.setAttribute('opacity','0.75');
  fp.appendChild(path);
  fp.className='fall-petal';
  const left=Math.random()*100;
  const drift=(Math.random()-0.5)*200;
  const dur=6+Math.random()*10;
  const delay=Math.random()*12;
  fp.style.cssText=`left:${left}%;--drift:${drift}px;animation-duration:${dur}s;animation-delay:-${delay}s`;
  scene.appendChild(fp);
}

// ── Flower click: re-bloom + burst ─────────────────────────
function triggerRebloom(flowerGroup){
  const petals = flowerGroup.querySelectorAll('.petal');
  petals.forEach((p,i)=>{
    p.style.animation='none';
    p.style.opacity='0';
    p.style.transform='scale(0) rotate(-40deg)';
    setTimeout(()=>{
      p.style.animation=`bloom 1.2s cubic-bezier(0.34,1.56,0.64,1) ${i*0.1}s forwards, shimmer 3s ease-in-out ${i*0.1}s infinite`;
    },20);
  });
}

function spawnBurst(x, y, count=8){
  for(let i=0;i<count;i++){
    const bp = document.createElementNS('http://www.w3.org/2000/svg','svg');
    bp.setAttribute('width','16');bp.setAttribute('height','30');
    bp.setAttribute('viewBox','-10 -32 20 36');
    const path = document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d','M0,0 Q-7,-14 -3,-26 Q0,-32 3,-26 Q7,-14 0,0');
    const cols=['#ff6b6b','#ff8a80','#c0392b','#e74c3c','#ffab91'];
    path.setAttribute('fill',cols[i%cols.length]);
    bp.appendChild(path);
    bp.className='burst-petal';
    const angle=(i/count)*Math.PI*2;
    const dist=60+Math.random()*80;
    const bx=Math.cos(angle)*dist, by=Math.sin(angle)*dist-60;
    bp.style.cssText=`left:${x}px;top:${y}px;--bx:${bx}px;--by:${by}px;transform:translate(-50%,-50%);position:fixed;z-index:999;pointer-events:none`;
    document.body.appendChild(bp);
    setTimeout(()=>bp.remove(),1100);
  }
}

document.querySelectorAll('.flower-group').forEach(fg=>{
  fg.addEventListener('click',e=>{
    e.stopPropagation();
    triggerRebloom(fg);
    const rect=fg.getBoundingClientRect();
    spawnBurst(rect.left+rect.width/2, rect.top+rect.height*0.25, 10);
  });
});

// ── Click anywhere: ripple + petal shower ──────────────────
document.addEventListener('click',e=>{
  if(e.target.closest('.flower-group')) return;
  // Ripple
  const rip=document.createElement('div');
  rip.className='ripple';
  rip.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;position:fixed;z-index:998`;
  document.body.appendChild(rip);
  setTimeout(()=>rip.remove(),900);
  // Small petal shower
  spawnBurst(e.clientX, e.clientY, 5);
});
</script>
</body></html>
