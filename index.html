<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garden for You</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#05000a;overflow:hidden;font-family:Georgia,serif}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 90% 55% at 50% 105%,rgba(80,0,80,.4) 0%,rgba(20,0,40,.2) 50%,transparent 70%);pointer-events:none;z-index:0}

#scene{position:fixed;inset:0;z-index:1}
#garden-svg{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100vw);height:min(92vh,700px)}

/* Flower sway */
.fg{transform-box:fill-box;transform-origin:bottom center}
#f1{animation:sw1 4.2s ease-in-out infinite}
#f2{animation:sw2 5.1s ease-in-out infinite;animation-delay:-1.3s}
#f3{animation:sw3 3.9s ease-in-out infinite;animation-delay:-.7s}
#f4{animation:sw1 4.8s ease-in-out infinite;animation-delay:-2.1s}
@keyframes sw1{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
@keyframes sw2{0%,100%{transform:rotate(1.5deg)}50%{transform:rotate(-2.2deg)}}
@keyframes sw3{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2.5deg)}}

/* Petal bloom on load */
.petal{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:bloom 1.3s cubic-bezier(.34,1.56,.64,1) forwards}
.p1{animation-delay:.05s}.p2{animation-delay:.15s}.p3{animation-delay:.25s}
.p4{animation-delay:.35s}.p5{animation-delay:.45s}.p6{animation-delay:.55s}
.p7{animation-delay:.65s}.p8{animation-delay:.75s}
@keyframes bloom{0%{transform:scale(.05) rotate(-35deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}

/* Shimmer */
.petals-g{animation:shimmer 3.5s ease-in-out infinite}
@keyframes shimmer{0%,100%{filter:brightness(1)}50%{filter:brightness(1.15)}}

/* Hover glow */
.fg .fhead{transition:filter .35s}
#f1:hover .fhead{filter:drop-shadow(0 0 20px rgba(255,200,0,.9)) drop-shadow(0 0 40px rgba(255,150,0,.5))}
#f2:hover .fhead{filter:drop-shadow(0 0 18px rgba(255,80,120,.9)) drop-shadow(0 0 38px rgba(220,0,80,.5))}
#f3:hover .fhead{filter:drop-shadow(0 0 18px rgba(255,255,255,.85)) drop-shadow(0 0 38px rgba(200,200,255,.4))}
#f4:hover .fhead{filter:drop-shadow(0 0 18px rgba(255,230,230,.9)) drop-shadow(0 0 38px rgba(255,180,200,.4))}
.fg:hover .petal{filter:brightness(1.25)}
.fg:hover .petals-g{animation:shimmer .8s ease-in-out infinite}
.fg:hover{cursor:pointer}

/* Daisy / rose / tulip extra animations */
#f4 .fhead ellipse{animation:dPulse 4s ease-in-out infinite}
@keyframes dPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
#f3 .petals-g{animation:rBreath 5s ease-in-out infinite}
@keyframes rBreath{0%,100%{filter:brightness(1)}50%{filter:brightness(1.1) drop-shadow(0 0 8px rgba(255,255,240,.5))}}
#f2 .petals-g{animation:tSway 6s ease-in-out infinite}
@keyframes tSway{0%,100%{transform:scaleX(1)}50%{transform:scaleX(1.04)}}
#f4 .petals-g{animation:dShimmer 3s ease-in-out infinite}
@keyframes dShimmer{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12) drop-shadow(0 0 8px rgba(200,230,255,.4))}}

/* Fireflies */
.ff{position:fixed;border-radius:50%;pointer-events:none;z-index:5;
  background:radial-gradient(circle,#fffde7 0%,#ffe57f 45%,transparent 70%);
  box-shadow:0 0 6px 3px rgba(255,240,100,.7),0 0 18px 8px rgba(255,210,40,.25);
  animation:ffMove linear infinite,ffPulse ease-in-out infinite}
@keyframes ffMove{0%{transform:translate(0,0);opacity:0}10%{opacity:1}88%{opacity:.9}100%{transform:translate(var(--dx),var(--dy));opacity:0}}
@keyframes ffPulse{0%,100%{box-shadow:0 0 6px 3px rgba(255,240,100,.7),0 0 18px 8px rgba(255,210,40,.25)}50%{box-shadow:0 0 12px 6px rgba(255,255,140,1),0 0 30px 14px rgba(255,220,60,.5)}}

/* Falling petals - canvas-driven via JS requestAnimationFrame, no CSS needed */

/* Touch burst petals */
.bp{position:fixed;pointer-events:none;z-index:20;
  animation:bpFly 1.1s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes bpFly{
  0%  {transform:translate(-50%,-50%) scale(1) rotate(0deg);opacity:1}
  100%{transform:translate(calc(-50% + var(--bx)),calc(-50% + var(--by))) scale(.1) rotate(240deg);opacity:0}
}

/* Ripple */
.rip{position:fixed;border-radius:50%;pointer-events:none;z-index:15;
  transform:translate(-50%,-50%);
  animation:ripOut .85s ease-out forwards}
@keyframes ripOut{
  0%  {width:0;height:0;opacity:1;outline:2px solid rgba(200,180,255,.8)}
  100%{width:140px;height:140px;opacity:0;outline:2px solid rgba(200,180,255,.05)}
}

/* Pills */
.pill{position:fixed;background:rgba(10,5,20,.78);border:1px solid rgba(180,140,255,.35);
  border-radius:999px;padding:clamp(7px,1.5vw,11px) clamp(14px,3vw,22px);
  color:#e8d5ff;font-size:clamp(11px,1.4vw,14px);letter-spacing:.4px;
  backdrop-filter:blur(10px);white-space:nowrap;z-index:10;pointer-events:none;
  box-shadow:0 0 18px rgba(120,60,180,.2);animation:pillFloat 3.2s ease-in-out infinite}
.pill:nth-child(1){top:clamp(12%,18%,22%);left:clamp(10px,4%,40px)}
.pill:nth-child(2){top:clamp(14%,22%,26%);right:clamp(10px,4%,40px);animation-delay:1.1s}
@keyframes pillFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

.real-flower{position:absolute;z-index:4;pointer-events:auto;user-select:none;transform-origin:bottom center;filter:drop-shadow(0 10px 20px rgba(0,0,0,.25)) drop-shadow(0 0 15px rgba(255,255,255,.08))}
.sunflower{left:17%;bottom:250px;width:180px;animation:sw1 4.2s ease-in-out infinite}
.tulip{left:34%;bottom:260px;width:140px;animation:sw2 5s ease-in-out infinite}
.rose{left:50%;bottom:270px;width:170px;animation:sw3 4.5s ease-in-out infinite}
.daisy{left:70%;bottom:255px;width:130px;animation:sw1 4.8s ease-in-out infinite}
.real-flower:hover{transform:scale(1.08);transition:.3s}

@media(max-width:600px){
  #garden-svg{width:100vw;height:88vh}
  .pill{font-size:10px;padding:6px 12px;max-width:42vw;white-space:normal;text-align:center;line-height:1.3}
  .sunflower{left:3%;width:120px;bottom:210px}
  .tulip{left:25%;width:95px;bottom:220px}
  .rose{left:48%;width:115px;bottom:220px}
  .daisy{left:72%;width:90px;bottom:215px}
  .pill:nth-child(1){top:8%;left:2%}
  .pill:nth-child(2){top:8%;right:2%}
}
</style>
</head>

for (let i = 0; i < 22; i++) {
  petals.push({
    x: Math.random() * window.innerWidth,
    y: -Math.random() * window.innerHeight,
    w: 8 + Math.random() * 14,
    h: 4 + Math.random() * 7,
    speed: 0.6 + Math.random() * 1.2,
    drift: (Math.random() - .5) * 0.8,
    rot: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - .5) * 0.04,
    color: PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)],
    alpha: 0.55 + Math.random() * 0.4,
  });
}

// Touch burst petals (temporary, drawn on canvas)
const burstPetals = [];

function addBurst(x, y, count) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.random() * 280 - 140) * Math.PI / 180;
    const speed = 3 + Math.random() * 5;
    burstPetals.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 4,
      w: 10 + Math.random() * 12,
      h: 5 + Math.random() * 6,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - .5) * 0.15,
      color: PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)],
      alpha: 1,
      life: 1,
    });
  }
}

function drawPetal(x, y, w, h, rot, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath();
  ctx.ellipse(0, 0, w / 2, h / 2, 0, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.restore();
}

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Ambient falling petals
  for (const p of petals) {
    p.y += p.speed;
    p.x += p.drift;
    p.rot += p.rotSpeed;
    if (p.y > canvas.height + 20) {
      p.y = -20;
      p.x = Math.random() * canvas.width;
    }
    drawPetal(p.x, p.y, p.w, p.h, p.rot, p.color, p.alpha);
  }

  // Burst petals
  for (let i = burstPetals.length - 1; i >= 0; i--) {
    const b = burstPetals[i];
    b.x += b.vx;
    b.y += b.vy;
    b.vy += 0.18; // gravity
    b.vx *= 0.97;
    b.rot += b.rotSpeed;
    b.life -= 0.022;
    b.alpha = b.life;
    if (b.life <= 0) { burstPetals.splice(i, 1); continue; }
    drawPetal(b.x, b.y, b.w, b.h, b.rot, b.color, b.alpha);
  }

  requestAnimationFrame(animate);
}
animate();

// ============================================================
// FIREFLIES - just 18, lightweight divs
// ============================================================
for (let i = 0; i < 18; i++) {
  const ff = document.createElement('div');
  const sz = 3 + Math.random() * 4;
  const flyDur = 6 + Math.random() * 9;
  const pulseDur = 1.2 + Math.random() * 1.6;
  const del = -(Math.random() * 10);
  const dx = (Math.random() - .5) * 350;
  const dy = (Math.random() - .5) * 250;
  ff.style.cssText = `position:fixed;border-radius:50%;pointer-events:none;z-index:9;
    width:${sz}px;height:${sz}px;
    left:${Math.random()*95}%;top:${5+Math.random()*80}%;
    background:radial-gradient(circle,#fffde7 0%,#ffe57f 45%,transparent 70%);
    box-shadow:0 0 6px 3px rgba(255,240,100,.7),0 0 16px 7px rgba(255,210,40,.25);
    --dx:${dx}px;--dy:${dy}px;
    animation:ffMove ${flyDur}s linear ${del}s infinite,ffPulse ${pulseDur}s ease-in-out ${-(Math.random()*2)}s infinite`;
  document.body.appendChild(ff);
}

// ============================================================
// RIPPLE
// ============================================================
function spawnRipple(x, y) {
  const d = document.createElement('div');
  d.className = 'rip';
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 950);
}

// ============================================================
// REBLOOM
// ============================================================
function triggerRebloom(fg) {
  fg.querySelectorAll('.petal').forEach((p, i) => {
    p.style.animation = 'none';
    p.style.opacity = '0';
    void p.offsetWidth;
    p.style.animation = `bloom 1.3s cubic-bezier(.34,1.56,.64,1) ${i * .07}s forwards`;
  });
}

// ============================================================
// FLOWER INTERACTIONS
// ============================================================
document.querySelectorAll('.fg').forEach(fg => {
  fg.addEventListener('mouseenter', () =>
    fg.querySelectorAll('.petals-g').forEach(pg => pg.style.animation = 'shimmer .7s ease-in-out infinite'));
  fg.addEventListener('mouseleave', () =>
    fg.querySelectorAll('.petals-g').forEach(pg => pg.style.animation = 'shimmer 3.5s ease-in-out infinite'));

  const fire = (x, y) => {
    triggerRebloom(fg);
    addBurst(x, y, 18);
    spawnRipple(x, y);
  };
  fg.addEventListener('click', e => {
    e.stopPropagation();
    const r = fg.getBoundingClientRect();
    fire(r.left + r.width / 2, r.top + r.height * .25);
  });
  fg.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    fire(t.clientX, t.clientY);
  }, { passive: false });
});

// ============================================================
// TOUCH / CLICK ANYWHERE
// ============================================================
document.addEventListener('click', e => {
  if (e.target.closest('.fg')) return;
  addBurst(e.clientX, e.clientY, 14);
  spawnRipple(e.clientX, e.clientY);
});
document.addEventListener('touchstart', e => {
  if (e.target.closest('.fg')) return;
  const t = e.touches[0];
  addBurst(t.clientX, t.clientY, 14);
  spawnRipple(t.clientX, t.clientY);
}, { passive: true });
</script>
