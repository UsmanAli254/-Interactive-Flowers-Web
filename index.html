<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden for You</title>
<style>
:root {
  --bg: #05000a;
  --stem: #2d6a2d;
  --leaf-a: #1a7a4a;
  --leaf-b: #0d5c35;
  --pill-bg: rgba(10,5,20,0.78);
  --pill-border: rgba(180,140,255,0.35);
  --pill-text: #e8d5ff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Georgia',serif}
body{position:relative}

body::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse 90% 55% at 50% 105%, rgba(80,0,80,0.45) 0%, rgba(30,0,50,0.25) 45%, transparent 70%);
  pointer-events:none;z-index:0;
}
body::after{
  content:'';position:absolute;inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  opacity:0.15;pointer-events:none;z-index:1;
}

#scene{position:relative;width:100vw;height:100vh;z-index:2;overflow:hidden}

#garden-svg{
  position:absolute;bottom:0;left:50%;
  transform:translateX(-50%);
  width:min(760px,100vw);
  height:min(92vh,700px);
}

/* ── Sway ── */
.fg{transform-box:fill-box;transform-origin:bottom center}
#f1{animation:sw1 4.2s ease-in-out infinite}
#f2{animation:sw2 5.1s ease-in-out infinite;animation-delay:-1.3s}
#f3{animation:sw3 3.9s ease-in-out infinite;animation-delay:-0.7s}
#f4{animation:sw1 4.8s ease-in-out infinite;animation-delay:-2.1s}
@keyframes sw1{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}
@keyframes sw2{0%,100%{transform:rotate(1.5deg)}50%{transform:rotate(-2.2deg)}}
@keyframes sw3{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(2.5deg)}}

/* ── Bloom ── */
.petal{transform-box:fill-box;transform-origin:50% 100%;opacity:0;animation:bloom 1.3s cubic-bezier(0.34,1.56,0.64,1) forwards}
.p1{animation-delay:0.05s}.p2{animation-delay:0.15s}.p3{animation-delay:0.25s}
.p4{animation-delay:0.35s}.p5{animation-delay:0.45s}.p6{animation-delay:0.55s}
.p7{animation-delay:0.65s}.p8{animation-delay:0.75s}
@keyframes bloom{0%{transform:scale(0.05) rotate(-35deg);opacity:0}100%{transform:scale(1) rotate(0deg);opacity:1}}

/* ── Shimmer wind ── */
.petals-g{animation:shimmer 3.5s ease-in-out infinite}
@keyframes shimmer{0%,100%{filter:brightness(1) saturate(1)}50%{filter:brightness(1.12) saturate(1.1)}}

/* ── Hover glow ── */
.fg .fhead{transition:filter 0.4s ease}
.fg:hover .fhead{cursor:pointer}
#f1:hover .fhead{filter:drop-shadow(0 0 18px rgba(255,200,0,0.95)) drop-shadow(0 0 40px rgba(255,160,0,0.5))}
#f2:hover .fhead{filter:drop-shadow(0 0 18px rgba(255,80,120,0.95)) drop-shadow(0 0 40px rgba(220,0,80,0.5))}
#f3:hover .fhead{filter:drop-shadow(0 0 18px rgba(255,255,255,0.9)) drop-shadow(0 0 40px rgba(200,200,255,0.5))}
#f4:hover .fhead{filter:drop-shadow(0 0 18px rgba(255,230,230,0.95)) drop-shadow(0 0 40px rgba(255,180,200,0.5))}
.fg:hover .petal{filter:brightness(1.25) saturate(1.2)}
.fg:hover{transform-origin:bottom center}

/* ── Fireflies ── */
.ff{position:absolute;border-radius:50%;background:#fffde7;
  box-shadow:0 0 6px 3px rgba(255,255,160,0.75);
  animation:fly linear infinite;pointer-events:none}
@keyframes fly{
  0%{transform:translate(0,0) scale(1);opacity:0}
  10%{opacity:1}80%{opacity:0.9}
  100%{transform:translate(var(--dx),var(--dy)) scale(0.6);opacity:0}
}

/* ── Falling petals ── */
.fp{position:fixed;top:-40px;pointer-events:none;animation:fall linear infinite}
@keyframes fall{
  0%{transform:translateY(0) rotate(0deg) translateX(0);opacity:0.85}
  100%{transform:translateY(110vh) rotate(600deg) translateX(var(--drift));opacity:0}
}

/* ── Ripple ── */
.ripple{position:fixed;border-radius:50%;border:2px solid rgba(200,180,255,0.55);
  pointer-events:none;transform:translate(-50%,-50%);
  animation:rout 0.85s ease-out forwards}
@keyframes rout{0%{width:0;height:0;opacity:1}100%{width:130px;height:130px;opacity:0}}

/* ── Burst ── */
.bp{position:fixed;pointer-events:none;animation:bfly 1.1s ease-out forwards}
@keyframes bfly{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--bx)),calc(-50% + var(--by))) scale(0.2);opacity:0}}

/* ── Pills ── */
.pill{
  position:absolute;background:var(--pill-bg);
  border:1px solid var(--pill-border);border-radius:999px;
  padding:clamp(7px,1.5vw,11px) clamp(14px,3vw,22px);
  color:var(--pill-text);font-size:clamp(11px,1.4vw,14px);
  letter-spacing:0.4px;backdrop-filter:blur(10px);
  white-space:nowrap;z-index:10;pointer-events:none;
  box-shadow:0 0 20px rgba(120,60,180,0.2);
  animation:fpill 3.2s ease-in-out infinite;
}
.pill:nth-child(1){top:clamp(12%,18%,22%);left:clamp(10px,4%,40px);animation-delay:0s}
.pill:nth-child(2){top:clamp(12%,20%,25%);right:clamp(10px,4%,40px);animation-delay:1.1s}
@keyframes fpill{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}

/* ── Mobile ── */
@media(max-width:600px){
  #garden-svg{width:100vw;height:88vh}
  .pill{font-size:10px;padding:6px 12px;max-width:42vw;white-space:normal;text-align:center;line-height:1.3}
  .pill:nth-child(1){top:10%;left:2%}
  .pill:nth-child(2){top:10%;right:2%}
}
</style>
</head>

  <div class="pill">you are my sunshine 🌻</div>

<script>
const scene = document.getElementById('scene');

// ── Fireflies ──────────────────────────────────────────────
for(let i=0;i<20;i++){
  const ff=document.createElement('div');
  ff.className='ff';
  const sz=2+Math.random()*3;
  const x=Math.random()*100, y=10+Math.random()*75;
  const dx=(Math.random()-0.5)*320, dy=(Math.random()-0.5)*220;
  const dur=5+Math.random()*9, del=Math.random()*10;
  ff.style.cssText=`left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;--dx:${dx}px;--dy:${dy}px;animation-duration:${dur}s;animation-delay:-${del}s`;
  scene.appendChild(ff);
}

// ── Falling petals ─────────────────────────────────────────
const fpColors=[
  ['#f9a825','#fb8c00'],  // sunflower
  ['#e91e8c','#f48fb1'],  // tulip
  ['#ede7f6','#ffffff'],  // rose
  ['#eceff1','#ffffff'],  // daisy
];
for(let i=0;i<14;i++){
  const fp=document.createElementNS('http://www.w3.org/2000/svg','svg');
  fp.setAttribute('width','18');fp.setAttribute('height','36');
  fp.setAttribute('viewBox','-12 -36 24 40');
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  const shapes=['M0,0 Q-8,-14 -3,-28 Q0,-34 3,-28 Q8,-14 0,0',
                'M0,0 Q-10,-10 -4,-22 Q0,-28 4,-22 Q10,-10 0,0',
                'M0,0 Q-6,-16 -2,-30 Q0,-36 2,-30 Q6,-16 0,0'];
  path.setAttribute('d',shapes[i%3]);
  const c=fpColors[i%4];
  path.setAttribute('fill',c[Math.floor(Math.random()*2)]);
  path.setAttribute('opacity','0.8');
  fp.appendChild(path);
  fp.className='fp';
  const left=Math.random()*100;
  const drift=(Math.random()-0.5)*220;
  const dur=7+Math.random()*11, del=Math.random()*14;
  fp.style.cssText=`left:${left}%;--drift:${drift}px;animation-duration:${dur}s;animation-delay:-${del}s`;
  scene.appendChild(fp);
}

// ── Hover: trigger shimmer boost ───────────────────────────
document.querySelectorAll('.fg').forEach(fg=>{
  fg.addEventListener('mouseenter',()=>{
    fg.querySelectorAll('.petals-g').forEach(pg=>{
      pg.style.animation='shimmer 1s ease-in-out infinite';
    });
  });
  fg.addEventListener('mouseleave',()=>{
    fg.querySelectorAll('.petals-g').forEach(pg=>{
      pg.style.animation='shimmer 3.5s ease-in-out infinite';
    });
  });
  // Touch support
  fg.addEventListener('touchstart',e=>{
    e.preventDefault();
    triggerRebloom(fg);
    const t=e.touches[0];
    spawnBurst(t.clientX,t.clientY,8);
  },{passive:false});
});

// ── Re-bloom ───────────────────────────────────────────────
function triggerRebloom(fg){
  fg.querySelectorAll('.petal').forEach((p,i)=>{
    p.style.animation='none';
    p.style.opacity='0';
    void p.offsetWidth;
    const d=i*0.08;
    p.style.animation=`bloom 1.3s cubic-bezier(0.34,1.56,0.64,1) ${d}s forwards, shimmer 3.5s ease-in-out ${d}s infinite`;
  });
}

// ── Burst petals ───────────────────────────────────────────
function spawnBurst(x,y,count){
  const cols=['#f9a825','#e91e8c','#ffffff','#eceff1','#fb8c00','#f48fb1'];
  for(let i=0;i<count;i++){
    const bp=document.createElementNS('http://www.w3.org/2000/svg','svg');
    bp.setAttribute('width','14');bp.setAttribute('height','28');
    bp.setAttribute('viewBox','-10 -30 20 34');
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d','M0,0 Q-6,-12 -2,-24 Q0,-30 2,-24 Q6,-12 0,0');
    path.setAttribute('fill',cols[i%cols.length]);
    bp.appendChild(path);
    bp.className='bp';
    const angle=(i/count)*Math.PI*2;
    const dist=55+Math.random()*75;
    const bx=Math.cos(angle)*dist, by=Math.sin(angle)*dist-55;
    bp.style.cssText=`left:${x}px;top:${y}px;--bx:${bx}px;--by:${by}px;z-index:999`;
    document.body.appendChild(bp);
    setTimeout(()=>bp.remove(),1200);
  }
}

// ── Click flower: rebloom + burst ─────────────────────────
document.querySelectorAll('.fg').forEach(fg=>{
  fg.addEventListener('click',e=>{
    e.stopPropagation();
    triggerRebloom(fg);
    const r=fg.getBoundingClientRect();
    spawnBurst(r.left+r.width/2, r.top+r.height*0.22, 10);
  });
});

// ── Click anywhere: ripple + shower ───────────────────────
document.addEventListener('click',e=>{
  if(e.target.closest('.fg')) return;
  const rip=document.createElement('div');
  rip.className='ripple';
  rip.style.left=e.clientX+'px';
  rip.style.top=e.clientY+'px';
  document.body.appendChild(rip);
  setTimeout(()=>rip.remove(),950);
  spawnBurst(e.clientX,e.clientY,5);
});
</script>
